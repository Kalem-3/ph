body.pharmas-premium.legal-page {
  background: #f4f7fa;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1100px) {
  body.pharmas-premium .nav-inner { border-radius: 18px; }
  body.pharmas-premium .hero-inner {
    grid-template-columns: minmax(0, 1fr) minmax(360px, .9fr);
    gap: 42px;
  }
  body.pharmas-premium .hero-image { min-height: 540px; }
  body.pharmas-premium .hero-image .product-img { width: min(410px, 92%); max-height: 520px; }
  .hero-float--one { right: -5px; }
  .hero-float--two { left: -5px; }
  body.pharmas-premium .why-grid,
  body.pharmas-premium .reviews-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  body.pharmas-premium .review-card:nth-child(2),
  body.pharmas-premium .review-card:nth-child(5) { transform: none; }
  body.pharmas-premium .review-card:nth-child(2):hover,
  body.pharmas-premium .review-card:nth-child(5):hover { transform: translateY(-7px); }
}

@media (max-width: 900px) {
  body.pharmas-premium #navbar { padding-top: 8px; }
  body.pharmas-premium .nav-inner { height: 68px; padding: 7px 10px; }
  body.pharmas-premium .logo-img { height: 51px; }
  body.pharmas-premium .hamburger span { background: #fff; }
  body.pharmas-premium #navbar.scrolled .hamburger span { background: var(--premium-navy); }
  body.pharmas-premium .mobile-menu {
    top: 84px;
    left: 22px;
    right: 22px;
    width: auto;
    max-height: calc(100vh - 100px);
    padding: 18px;
    border: 1px solid rgba(12,23,48,.08);
    border-radius: 22px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 24px 65px rgba(5,23,54,.18);
    backdrop-filter: blur(18px);
  }
  body.pharmas-premium .mobile-link {
    border-radius: 12px;
    color: var(--premium-navy);
  }
  body.pharmas-premium .mobile-link:hover { background: rgba(21,89,186,.07); }

  body.pharmas-premium #hero {
    min-height: auto;
    padding: 145px 0 105px;
  }
  body.pharmas-premium .hero-inner {
    grid-template-columns: 1fr;
    gap: 58px;
  }
  body.pharmas-premium .hero-text {
    max-width: 740px;
    text-align: center;
    margin-inline: auto;
  }
  body.pharmas-premium .hero-sub { margin-inline: auto; }
  body.pharmas-premium .hero-actions { justify-content: center; }
  .hero-proof-grid { max-width: 650px; margin-inline: auto; }
  body.pharmas-premium .hero-image { min-height: 600px; max-width: 610px; width: 100%; margin-inline: auto; }
  body.pharmas-premium .hero-image::before { inset: 25px 28px 0; }
  body.pharmas-premium .about-grid { grid-template-columns: 1fr; }
  body.pharmas-premium .about-image-wrap { width: min(590px, 100%); margin-inline: auto; }
  body.pharmas-premium .about-content { max-width: 760px; margin-inline: auto; }
  body.pharmas-premium .pricing-grid { grid-template-columns: 1fr; max-width: 720px; }
  body.pharmas-premium .pricing-card { padding: 34px; }
}

@media (max-width: 700px) {
  body.pharmas-premium .container { padding-inline: 18px; }
  body.pharmas-premium .section-header { margin-bottom: 42px; }
  body.pharmas-premium .section-header h2,
  body.pharmas-premium .fg-header h2 { font-size: clamp(2.1rem, 11vw, 3.4rem); }

  body.pharmas-premium #hero { padding: 128px 0 88px; }
  body.pharmas-premium .hero-text h1 { font-size: clamp(3.55rem, 18vw, 5.3rem); }
  body.pharmas-premium .hero-sub { font-size: .96rem; }
  body.pharmas-premium .hero-actions { display: grid; grid-template-columns: 1fr; }
  body.pharmas-premium .hero-actions a { width: 100%; }
  .hero-proof-grid { grid-template-columns: 1fr; }
  .hero-proof-item {
    min-height: auto;
    display: grid;
    grid-template-columns: 28px 1fr;
    column-gap: 8px;
    padding: 14px;
  }
  .hero-proof-item i { grid-row: 1 / 3; margin-top: 4px; }
  .hero-proof-item strong { margin-top: 0; }
  body.pharmas-premium .hero-image { min-height: 490px; }
  body.pharmas-premium .hero-image::before { inset: 24px 10px 0; border-radius: 30px; }
  body.pharmas-premium .hero-image .product-img { width: min(360px, 88%); max-height: 440px; border-radius: 25px; }
  .hero-number { right: 0; top: 35px; font-size: 14rem; }
  .hero-float { min-width: 160px; padding: 10px; border-radius: 15px; }
  .hero-float--one { right: 0; top: 65px; }
  .hero-float--two { left: 0; bottom: 40px; }
  .hero-float i { width: 32px; height: 32px; }

  body.pharmas-premium #trust-bar { margin-top: -26px; padding-bottom: 42px; }
  body.pharmas-premium .cert-strip-visual {
    justify-content: flex-start;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 15px 8px;
    border-radius: 20px;
  }
  body.pharmas-premium .csv-item {
    min-width: 128px;
    scroll-snap-align: start;
  }

  body.pharmas-premium #foto-galeri,
  body.pharmas-premium #nasil-calisir,
  body.pharmas-premium #hakkimizda,
  body.pharmas-premium #neden-biz,
  body.pharmas-premium #yorumlar,
  body.pharmas-premium #sss,
  body.pharmas-premium #satin-al,
  body.pharmas-premium #iletisim { padding: 92px 0; }

  body.pharmas-premium .fg-slider-wrap { width: calc(100% - 20px); padding: 8px; border-radius: 23px; }
  body.pharmas-premium .fg-slide img { height: 64vh; border-radius: 18px; }
  body.pharmas-premium .fg-btn { width: 44px; height: 44px; }
  body.pharmas-premium .fg-prev { left: 13px; }
  body.pharmas-premium .fg-next { right: 13px; }

  body.pharmas-premium #nasil-calisir::before { inset: 22px 8px; border-radius: 28px; }
  body.pharmas-premium .step-card--wide { padding: 32px 22px; }

  body.pharmas-premium .about-image-wrap { min-height: 510px; }
  body.pharmas-premium .about-img { width: calc(100% - 32px); height: 455px; margin: 18px 0 0 16px; }
  body.pharmas-premium .about-img-bg { inset: 15px 0 20px 14px; }
  body.pharmas-premium .about-badge-float { right: 0; bottom: 28px; padding: 14px; }
  body.pharmas-premium .about-content h2 { font-size: clamp(2.25rem, 11vw, 3.4rem); }

  body.pharmas-premium .why-grid,
  body.pharmas-premium .reviews-grid { grid-template-columns: 1fr; }
  body.pharmas-premium .why-card { min-height: auto; }
  body.pharmas-premium .review-card { min-height: auto; }

  body.pharmas-premium .pricing-card { padding: 27px 20px; }
  body.pharmas-premium .pricing-popular-badge { position: static; display: inline-flex; margin-bottom: 18px; }
  body.pharmas-premium .pricing-ctas { grid-template-columns: 1fr; }

  body.pharmas-premium .contact-form-wrap { padding: 24px 18px; }
  body.pharmas-premium .contact-info { padding: 10px 18px; }

  body.pharmas-premium .order-strip-inner { align-items: flex-start; }
  body.pharmas-premium .strip-btn-ty { width: 100%; justify-content: center; }

  body.pharmas-premium .float-group { right: 14px; bottom: 14px; }
  body.pharmas-premium .trendyol-float,
  body.pharmas-premium .whatsapp-float { width: 52px; height: 52px; }
  body.pharmas-premium .back-to-top { right: 16px; bottom: 140px; }
  body.pharmas-premium .kvkk-banner { left: 10px; right: 10px; bottom: 10px; }
  body.pharmas-premium .kvkk-inner { padding: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* Mobile density refinements */
@media (max-width: 700px) {
  body.pharmas-premium #hero { padding-top: 112px; }
  body.pharmas-premium .hero-inner { gap: 34px; }
  .hero-proof-grid {
    grid-template-columns: repeat(3, 185px);
    gap: 10px;
    overflow-x: auto;
    margin-top: 28px;
    padding-bottom: 6px;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .hero-proof-grid::-webkit-scrollbar { display: none; }
  .hero-proof-item {
    min-height: 94px;
    display: block;
    padding: 14px;
    scroll-snap-align: start;
    text-align: left;
  }
  .hero-proof-item strong { margin-top: 8px; }
  body.pharmas-premium .hero-image { min-height: 430px; }
  body.pharmas-premium .float-group { flex-direction: row; }
}
@media (max-width: 700px) {
  body.pharmas-premium .hero-text { min-width: 0; width: 100%; overflow: hidden; }
  .hero-proof-grid { width: 100%; max-width: 100%; }
}

body.pharmas-premium .float-group {
  opacity: 0;
  transform: translateY(14px);
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
body.pharmas-premium.premium-floats-ready .float-group {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
