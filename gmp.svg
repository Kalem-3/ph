/* ============================================================
   PHARMAS HEALTH — PREMIUM VISUAL LAYER
   This file intentionally overrides css/style.css without
   changing the site's original content or business logic.
   ============================================================ */

:root {
  --premium-navy: #06152f;
  --premium-navy-2: #0a2550;
  --premium-blue: #1559ba;
  --premium-cyan: #57b9e9;
  --premium-orange: #f08a35;
  --premium-orange-soft: #ffd8b2;
  --premium-green: #35a96f;
  --premium-cream: #f7f3ed;
  --premium-mist: #edf5fb;
  --premium-ink: #0c1730;
  --premium-muted: #657089;
  --premium-line: rgba(12, 23, 48, .10);
  --premium-glass: rgba(255,255,255,.72);
  --premium-shadow: 0 28px 80px rgba(5, 23, 54, .14);
  --premium-shadow-soft: 0 16px 45px rgba(5, 23, 54, .09);
  --premium-radius: 28px;
  --premium-radius-sm: 18px;
  --premium-font: 'Manrope', 'Inter', system-ui, sans-serif;
  --premium-display: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
}

html {
  background: var(--premium-navy);
  scroll-padding-top: 92px;
}

body.pharmas-premium {
  font-family: var(--premium-font);
  color: var(--premium-ink);
  background:
    radial-gradient(circle at 5% 18%, rgba(79, 182, 232, .08), transparent 22%),
    radial-gradient(circle at 95% 58%, rgba(240, 138, 53, .06), transparent 24%),
    #fff;
  text-rendering: optimizeLegibility;
}

body.pharmas-premium::selection {
  background: rgba(240, 138, 53, .28);
  color: var(--premium-navy);
}

body.pharmas-premium h1,
body.pharmas-premium h2,
body.pharmas-premium h3,
body.pharmas-premium h4,
body.pharmas-premium h5 {
  font-family: var(--premium-display);
  letter-spacing: -.035em;
}

body.pharmas-premium .container {
  max-width: 1240px;
  padding-inline: 30px;
}

body.pharmas-premium section {
  position: relative;
}

body.pharmas-premium .section-header {
  max-width: 800px;
  margin: 0 auto 58px;
}

body.pharmas-premium .section-header h2,
body.pharmas-premium .fg-header h2 {
  margin-top: 16px;
  color: var(--premium-navy);
  font-size: clamp(2.35rem, 4.7vw, 4.7rem);
  line-height: .98;
  font-weight: 750;
  text-wrap: balance;
}

body.pharmas-premium .section-header p,
body.pharmas-premium .fg-header p {
  max-width: 650px;
  margin: 18px auto 0;
  color: var(--premium-muted);
  font-size: 1.04rem;
  line-height: 1.8;
}

body.pharmas-premium .section-badge,
body.pharmas-premium .badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 7px 14px;
  border: 1px solid rgba(21, 89, 186, .14);
  border-radius: 999px;
  background: rgba(21, 89, 186, .07);
  color: var(--premium-blue);
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
}

body.pharmas-premium .section-badge::before,
body.pharmas-premium .badge::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--premium-orange);
  box-shadow: 0 0 0 5px rgba(240, 138, 53, .12);
}

/* ---------- Scroll progress ---------- */
.premium-scroll-progress {
  position: fixed;
  inset: 0 auto auto 0;
  z-index: 2500;
  width: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--premium-orange), #ffc183, var(--premium-cyan));
  box-shadow: 0 0 18px rgba(240, 138, 53, .55);
  pointer-events: none;
}

/* ============================================================
   NAVBAR
   ============================================================ */
body.pharmas-premium #navbar {
  padding: 12px 0 0;
  transition: padding .25s ease, background .25s ease, box-shadow .25s ease;
}

body.pharmas-premium #navbar::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(4, 16, 39, .72), rgba(4,16,39,0));
  opacity: 1;
  pointer-events: none;
  transition: opacity .25s ease;
}

body.pharmas-premium #navbar.scrolled {
  padding-top: 8px;
  background: transparent;
  box-shadow: none;
  backdrop-filter: none;
}

body.pharmas-premium #navbar.scrolled::before { opacity: 0; }

body.pharmas-premium .nav-inner {
  position: relative;
  height: 74px;
  padding: 8px 12px 8px 14px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 22px;
  background: rgba(6, 21, 47, .42);
  backdrop-filter: blur(18px) saturate(150%);
  box-shadow: 0 18px 50px rgba(0,0,0,.14);
  transition: background .25s ease, border .25s ease, box-shadow .25s ease;
}

body.pharmas-premium #navbar.scrolled .nav-inner {
  border-color: rgba(12,23,48,.08);
  background: rgba(255,255,255,.90);
  box-shadow: 0 18px 50px rgba(6,21,47,.11);
}

body.pharmas-premium .logo-img {
  height: 58px;
  padding: 6px 13px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,.10);
}

body.pharmas-premium .nav-links { gap: 2px; }

body.pharmas-premium .nav-links a,
body.pharmas-premium .nav-dd-trigger {
  padding: 10px 12px;
  border-radius: 12px;
  font-size: .84rem;
  font-weight: 650;
  letter-spacing: -.01em;
}

body.pharmas-premium .nav-links a:hover,
body.pharmas-premium .nav-dd-trigger:hover {
  background: rgba(255,255,255,.10);
  color: #fff;
}

body.pharmas-premium #navbar.scrolled .nav-links a:hover,
body.pharmas-premium #navbar.scrolled .nav-dd-trigger:hover {
  background: rgba(21,89,186,.07);
  color: var(--premium-blue);
}

body.pharmas-premium .btn-nav,
body.pharmas-premium .btn-nav-buy {
  min-height: 42px;
  padding: 10px 17px !important;
  border-radius: 13px !important;
  box-shadow: 0 10px 24px rgba(0,0,0,.14);
}

body.pharmas-premium .btn-nav {
  background: rgba(255,255,255,.12) !important;
  border: 1px solid rgba(255,255,255,.22);
}

body.pharmas-premium #navbar.scrolled .btn-nav {
  background: var(--premium-navy) !important;
  border-color: var(--premium-navy);
}

body.pharmas-premium .btn-nav-buy {
  background: linear-gradient(135deg, #39af76, #248d5d) !important;
}

body.pharmas-premium .nav-dd-menu {
  top: calc(100% + 12px);
  min-width: 258px;
  padding: 10px;
  border: 1px solid rgba(12,23,48,.09);
  border-radius: 20px;
  box-shadow: 0 24px 60px rgba(5,23,54,.16);
}

body.pharmas-premium .nav-dd-menu a {
  min-height: 42px;
  border-radius: 12px;
}

/* ============================================================
   HERO
   ============================================================ */
body.pharmas-premium #hero {
  min-height: 890px;
  padding: 168px 0 118px;
  background:
    radial-gradient(circle at 78% 23%, rgba(70, 151, 237, .30), transparent 28%),
    radial-gradient(circle at 16% 88%, rgba(35, 170, 120, .17), transparent 27%),
    linear-gradient(128deg, #041125 0%, #071b3e 48%, #0b2e61 100%);
  overflow: hidden;
}

body.pharmas-premium #hero::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: .18;
  background-image:
    linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 66px 66px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), transparent 86%);
}

body.pharmas-premium #hero::after {
  content: '';
  position: absolute;
  width: 680px;
  height: 680px;
  right: -250px;
  bottom: -360px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50%;
  box-shadow:
    0 0 0 78px rgba(255,255,255,.025),
    0 0 0 156px rgba(255,255,255,.02);
}

body.pharmas-premium .hero-bg {
  opacity: .55;
}

body.pharmas-premium .hero-bg::before {
  width: 560px;
  height: 560px;
  top: -260px;
  left: -250px;
  background: radial-gradient(circle, rgba(89,190,235,.24), transparent 67%);
}

body.pharmas-premium .hero-bg::after {
  width: 650px;
  height: 650px;
  right: -230px;
  top: 70px;
  background: radial-gradient(circle, rgba(240,138,53,.16), transparent 68%);
}

body.pharmas-premium .hero-inner {
  position: relative;
  z-index: 3;
  grid-template-columns: minmax(0, .92fr) minmax(440px, 1.08fr);
  gap: clamp(48px, 7vw, 100px);
  align-items: center;
}

body.pharmas-premium .hero-text {
  max-width: 665px;
}

body.pharmas-premium .hero-text .badge {
  color: #dbeeff;
  border-color: rgba(255,255,255,.15);
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(10px);
}

body.pharmas-premium .hero-text h1 {
  margin: 26px 0 24px;
  color: #fff;
  font-size: clamp(4.1rem, 7.1vw, 7.5rem);
  line-height: .88;
  font-weight: 770;
  letter-spacing: -.075em;
  text-shadow: 0 20px 55px rgba(0,0,0,.22);
}

body.pharmas-premium .hero-text h1 .highlight {
  display: inline-block;
  position: relative;
  color: #ff9f4f !important;
  font-style: italic;
  font-weight: 680;
}

body.pharmas-premium .hero-text h1 .highlight::after {
  content: '';
  position: absolute;
  left: 4px;
  right: -3px;
  bottom: -9px;
  height: 7px;
  border-radius: 999px;
  background: linear-gradient(90deg, #ff8c36, rgba(255,185,113,.14));
}

body.pharmas-premium .hero-sub {
  max-width: 610px;
  color: rgba(235,245,255,.74);
  font-size: clamp(1.02rem, 1.4vw, 1.18rem);
  line-height: 1.82;
}

body.pharmas-premium .hero-actions {
  margin-top: 34px;
  gap: 14px;
}

body.pharmas-premium .btn-primary,
body.pharmas-premium .btn-secondary-outline,
body.pharmas-premium .btn-trendyol,
body.pharmas-premium .btn-iyzico {
  min-height: 54px;
  border-radius: 16px;
  padding: 0 24px;
  font-weight: 750;
  letter-spacing: -.01em;
}

body.pharmas-premium .hero-actions .btn-primary {
  background: linear-gradient(135deg, #f49a4d, #e96f1f);
  box-shadow: 0 18px 38px rgba(240,138,53,.28);
}

body.pharmas-premium .hero-actions .btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 22px 45px rgba(240,138,53,.38);
}

body.pharmas-premium .hero-actions .btn-secondary-outline {
  color: #fff;
  border: 1px solid rgba(255,255,255,.23);
  background: rgba(255,255,255,.07);
  backdrop-filter: blur(12px);
}

body.pharmas-premium .hero-actions .btn-secondary-outline:hover {
  border-color: rgba(255,255,255,.48);
  background: rgba(255,255,255,.13);
  transform: translateY(-3px);
}

.hero-proof-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 38px;
}

.hero-proof-item {
  min-height: 92px;
  padding: 15px 14px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 17px;
  background: rgba(255,255,255,.055);
  backdrop-filter: blur(12px);
}

.hero-proof-item i {
  color: #76d3aa;
  font-size: .95rem;
}

.hero-proof-item strong,
.hero-proof-item span {
  display: block;
}

.hero-proof-item strong {
  margin-top: 9px;
  color: #fff;
  font-size: .82rem;
}

.hero-proof-item span {
  margin-top: 3px;
  color: rgba(228,240,252,.58);
  font-size: .67rem;
  line-height: 1.45;
}

body.pharmas-premium .hero-image {
  position: relative;
  min-height: 610px;
  display: grid;
  place-items: center;
  isolation: isolate;
}

body.pharmas-premium .hero-image::before {
  content: '';
  position: absolute;
  inset: 22px 2px 0 34px;
  z-index: -2;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 44px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.035)),
    radial-gradient(circle at 65% 15%, rgba(86,184,234,.18), transparent 34%);
  box-shadow: 0 45px 100px rgba(0,0,0,.28);
  backdrop-filter: blur(10px);
  transform: rotate(3deg);
}

body.pharmas-premium .hero-image::after {
  content: '';
  position: absolute;
  left: 10%;
  right: 4%;
  bottom: 8%;
  height: 70px;
  z-index: -1;
  border-radius: 50%;
  background: rgba(0,0,0,.45);
  filter: blur(28px);
}

body.pharmas-premium .hero-image .product-glow {
  width: 470px;
  height: 470px;
  background: radial-gradient(circle, rgba(98,190,235,.28), rgba(44,111,202,.12) 46%, transparent 72%);
  filter: blur(3px);
}

body.pharmas-premium .hero-image .product-img {
  width: min(465px, 88%);
  max-height: 570px;
  object-fit: cover;
  object-position: center;
  border-radius: 34px;
  box-shadow: 0 28px 70px rgba(0,0,0,.36);
  transform: rotate(-1.5deg);
  transition: transform .5s cubic-bezier(.2,.8,.2,1), filter .5s ease;
}

body.pharmas-premium .hero-image:hover .product-img {
  transform: translateY(-9px) rotate(0deg) scale(1.015);
  filter: saturate(1.06) contrast(1.02);
}

.hero-number {
  position: absolute;
  right: -12px;
  top: 0;
  z-index: -1;
  color: rgba(255,255,255,.07);
  font-family: var(--premium-display);
  font-size: clamp(14rem, 25vw, 22rem);
  font-weight: 850;
  line-height: 1;
}

.hero-float {
  position: absolute;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 190px;
  padding: 13px 15px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 18px;
  background: rgba(7,27,61,.72);
  color: #fff;
  box-shadow: 0 18px 40px rgba(0,0,0,.24);
  backdrop-filter: blur(16px);
}

.hero-float i {
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: rgba(255,255,255,.10);
  color: #72d6ac;
}

.hero-float strong,
.hero-float small { display: block; }
.hero-float strong { font-size: .78rem; }
.hero-float small { margin-top: 2px; color: rgba(255,255,255,.57); font-size: .65rem; }
.hero-float--one { right: -18px; top: 105px; }
.hero-float--two { left: -12px; bottom: 72px; }

body.pharmas-premium .particle {
  background: rgba(155,218,249,.65);
  box-shadow: 0 0 16px rgba(96,190,235,.55);
}

body.pharmas-premium .hero-wave {
  height: 72px;
  bottom: -2px;
}

body.pharmas-premium .hero-wave path { fill: #fff; }

/* ============================================================
   TRUST BAR
   ============================================================ */
body.pharmas-premium #trust-bar {
  z-index: 5;
  margin-top: -42px;
  padding: 0 0 56px;
  background: transparent;
}

body.pharmas-premium .cert-strip-visual {
  padding: 20px 18px;
  border: 1px solid rgba(12,23,48,.08);
  border-radius: 25px;
  background: rgba(255,255,255,.91);
  box-shadow: 0 25px 65px rgba(5,23,54,.12);
  backdrop-filter: blur(18px);
}

body.pharmas-premium .csv-item {
  min-width: 112px;
  padding: 8px 14px;
  border-right: 1px solid rgba(12,23,48,.08);
}

body.pharmas-premium .csv-item:last-child { border-right: 0; }

body.pharmas-premium .csv-img,
body.pharmas-premium .csv-icon-wrap {
  width: 45px;
  height: 45px;
  filter: drop-shadow(0 8px 12px rgba(5,23,54,.10));
}

body.pharmas-premium .csv-icon-wrap {
  border-radius: 15px;
  background: linear-gradient(145deg, rgba(53,169,111,.12), rgba(21,89,186,.07));
  color: var(--premium-green);
}

body.pharmas-premium .csv-name {
  margin-top: 8px;
  color: var(--premium-navy);
  font-size: .75rem;
  font-weight: 800;
}

body.pharmas-premium .csv-sub {
  color: #8992a5;
  font-size: .62rem;
}

/* ============================================================
   PHOTO GALLERY
   ============================================================ */
body.pharmas-premium #foto-galeri {
  padding: 86px 0 118px;
  background:
    radial-gradient(circle at 90% 10%, rgba(89,185,233,.12), transparent 23%),
    linear-gradient(180deg, #fff, #f1f7fb 100%);
  overflow: hidden;
}

body.pharmas-premium #foto-galeri::before {
  content: 'MAGNESIUM';
  position: absolute;
  left: -12px;
  top: 48px;
  color: rgba(9, 38, 82, .028);
  font-family: var(--premium-display);
  font-size: clamp(7rem, 15vw, 14rem);
  font-weight: 850;
  line-height: 1;
  letter-spacing: -.08em;
  pointer-events: none;
}

body.pharmas-premium #foto-galeri .fg-header {
  position: relative;
  z-index: 2;
  margin-bottom: 42px;
}

body.pharmas-premium .fg-slider-wrap {
  width: min(1180px, calc(100% - 42px));
  margin-inline: auto;
  padding: 16px;
  border: 1px solid rgba(12,23,48,.08);
  border-radius: 34px;
  background: rgba(255,255,255,.72);
  box-shadow: var(--premium-shadow);
  backdrop-filter: blur(16px);
}

body.pharmas-premium .fg-track {
  border-radius: 24px;
}

body.pharmas-premium .fg-slide {
  padding: 0;
  background: #eaf1f7;
}

body.pharmas-premium .fg-slide img {
  width: 100%;
  height: min(72vh, 680px);
  object-fit: contain;
  border-radius: 24px;
  background: linear-gradient(145deg, #eef5fa, #fff);
}

body.pharmas-premium .fg-slide img:hover { transform: scale(1.012); }

body.pharmas-premium .fg-btn {
  width: 54px;
  height: 54px;
  border: 1px solid rgba(255,255,255,.30);
  background: rgba(6,21,47,.78);
  color: #fff;
  box-shadow: 0 14px 32px rgba(5,23,54,.22);
  backdrop-filter: blur(12px);
}

body.pharmas-premium .fg-btn:hover {
  background: var(--premium-orange);
  transform: translateY(-50%) scale(1.06);
}

body.pharmas-premium .fg-dot {
  width: 8px;
  height: 8px;
  background: rgba(6,21,47,.18);
}

body.pharmas-premium .fg-dot.active {
  width: 30px;
  border-radius: 999px;
  background: var(--premium-orange);
}

/* ============================================================
   USE / HOW IT WORKS
   ============================================================ */
body.pharmas-premium #nasil-calisir {
  padding: 118px 0;
  background: #fff;
}

body.pharmas-premium #nasil-calisir::before {
  content: '';
  position: absolute;
  inset: 50px 5% 50px;
  border-radius: 50px;
  background:
    radial-gradient(circle at 12% 12%, rgba(89,185,233,.14), transparent 24%),
    radial-gradient(circle at 88% 80%, rgba(240,138,53,.11), transparent 25%),
    linear-gradient(145deg, #f4f9fd, #fbfcfe);
}

body.pharmas-premium #nasil-calisir .container { position: relative; }

body.pharmas-premium .steps-row--single {
  max-width: 920px;
  margin-inline: auto;
}

body.pharmas-premium .step-card--wide {
  min-height: 220px;
  padding: 42px 48px;
  border: 1px solid rgba(12,23,48,.08);
  border-radius: 30px;
  background: rgba(255,255,255,.82);
  box-shadow: var(--premium-shadow-soft);
  backdrop-filter: blur(14px);
}

body.pharmas-premium .step-card--wide .step-num {
  width: 74px;
  height: 74px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(53,169,111,.14), rgba(21,89,186,.08));
}

body.pharmas-premium .step-card--wide h4 {
  color: var(--premium-navy);
  font-size: 1.55rem;
}

body.pharmas-premium .step-card--wide p {
  max-width: 650px;
  margin: 12px auto 0;
  color: var(--premium-muted);
  font-size: 1.02rem;
}

/* ============================================================
   ABOUT
   ============================================================ */
body.pharmas-premium #hakkimizda {
  padding: 130px 0;
  background:
    radial-gradient(circle at 14% 18%, rgba(85,185,235,.13), transparent 25%),
    linear-gradient(155deg, #f1f7fb 0%, #fff 58%, #f8f4ef 100%);
  overflow: hidden;
}

body.pharmas-premium #hakkimizda::after {
  content: '';
  position: absolute;
  width: 480px;
  height: 480px;
  right: -220px;
  bottom: -230px;
  border: 1px solid rgba(21,89,186,.10);
  border-radius: 50%;
  box-shadow: 0 0 0 70px rgba(21,89,186,.025), 0 0 0 140px rgba(21,89,186,.018);
}

body.pharmas-premium .about-grid {
  grid-template-columns: minmax(390px, .92fr) minmax(0, 1.08fr);
  gap: clamp(64px, 8vw, 112px);
  align-items: center;
}

body.pharmas-premium .about-image-wrap {
  min-height: 680px;
  isolation: isolate;
}

body.pharmas-premium .about-img-bg {
  inset: 25px 8px 25px 30px;
  border-radius: 48% 48% 28px 28px;
  background:
    linear-gradient(145deg, rgba(7,32,71,.98), rgba(14,67,132,.94)),
    #0b2754;
  box-shadow: 0 40px 85px rgba(6,21,47,.22);
  transform: rotate(-3deg);
}

body.pharmas-premium .about-img {
  width: calc(100% - 54px);
  height: 610px;
  margin: 28px 0 0 28px;
  border-radius: 44% 44% 24px 24px;
  object-fit: cover;
  object-position: center;
